<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1929"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="50%" style="stop-color:#1976D2"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6"/>
      <stop offset="40%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="50%" style="stop-color:#BDBDBD"/>
      <stop offset="100%" style="stop-color:#9E9E9E"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#E8E8E8"/>
      <stop offset="70%" style="stop-color:#B0B0B0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Outer glow -->
  <ellipse cx="200" cy="180" rx="140" ry="130" fill="none" stroke="#2196F3" stroke-width="1" opacity="0.3" filter="url(#glow)"/>

  <!-- Gear (cog wheel) - back -->
  <g transform="translate(200, 160)" filter="url(#shadow)">
    <!-- Gear teeth -->
    <g fill="url(#blueGrad)" stroke="#1565C0" stroke-width="1">
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(30)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(60)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(90)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(120)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(150)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(180)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(210)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(240)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(270)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(300)"/>
      <path d="M0,-110 L15,-105 L15,-90 L-15,-90 L-15,-105 Z" transform="rotate(330)"/>
    </g>
    <!-- Gear body -->
    <circle cx="0" cy="0" r="88" fill="url(#blueGrad)" stroke="#1565C0" stroke-width="2"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#1976D2" stroke-width="1.5" opacity="0.5"/>
    <!-- Gear center hole -->
    <circle cx="0" cy="0" r="35" fill="url(#bgGrad)" stroke="#0D47A1" stroke-width="2"/>
  </g>

  <!-- Wrench - positioned on left side of gear -->
  <g transform="translate(120, 100) rotate(-35)" filter="url(#shadow)">
    <!-- Wrench handle -->
    <rect x="-8" y="-80" width="16" height="120" rx="6" fill="url(#chromeGrad)" stroke="#9E9E9E" stroke-width="1"/>
    <!-- Wrench handle detail lines -->
    <line x1="-5" y1="-60" x2="-5" y2="20" stroke="#ccc" stroke-width="0.8"/>
    <line x1="5" y1="-60" x2="5" y2="20" stroke="#ccc" stroke-width="0.8"/>
    <!-- Wrench head (open end) -->
    <path d="M-22,-80 Q-22,-100 -15,-105 L-8,-80 L8,-80 L15,-105 Q22,-100 22,-80 L22,-65 Q22,-55 15,-50 L8,-70 L-8,-70 L-15,-50 Q-22,-55 -22,-65 Z" 
          fill="url(#chromeGrad)" stroke="#9E9E9E" stroke-width="1.5"/>
    <!-- Wrench head inner -->
    <path d="M-12,-75 L-8,-80 L8,-80 L12,-75 L12,-68 L8,-65 L-8,-65 L-12,-68 Z" 
          fill="#E8E8E8" stroke="#BDBDBD" stroke-width="0.5"/>
    <!-- Handle grip lines -->
    <rect x="-6" y="10" width="12" height="3" rx="1" fill="#999" opacity="0.4"/>
    <rect x="-6" y="18" width="12" height="3" rx="1" fill="#999" opacity="0.4"/>
    <rect x="-6" y="26" width="12" height="3" rx="1" fill="#999" opacity="0.4"/>
  </g>

  <!-- Car silhouette - stylized sports car -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- Car body -->
    <path d="M-95,15 
             L-90,10 L-70,-5 L-50,-15 L-30,-22 L-10,-28 L10,-30 L30,-30 L50,-28 
             L70,-22 L85,-12 L95,0 L100,10 L100,15 
             L95,20 L80,22 L75,15 L65,15 L60,22 
             L20,22 L15,15 L-15,15 L-20,22 
             L-65,22 L-70,15 L-80,15 L-85,22 L-95,20 Z" 
          fill="url(#carGrad)" stroke="#1565C0" stroke-width="1.5"/>
    
    <!-- Car roof/window area -->
    <path d="M-40,-18 L-20,-26 L20,-28 L50,-24 L65,-16 L60,-10 L-35,-10 Z" 
          fill="#0D47A1" opacity="0.6"/>
    
    <!-- Window highlights -->
    <path d="M-30,-16 L-15,-24 L15,-26 L40,-22 L50,-16 L45,-12 L-25,-12 Z" 
          fill="#1565C0" opacity="0.4"/>
    
    <!-- Headlights -->
    <ellipse cx="88" cy="5" rx="8" ry="5" fill="#FFF" opacity="0.9"/>
    <ellipse cx="88" cy="5" rx="5" ry="3" fill="#E3F2FD"/>
    <ellipse cx="-85" cy="5" rx="6" ry="4" fill="#FF5252" opacity="0.8"/>
    
    <!-- Front wheels -->
    <g transform="translate(-55, 20)">
      <circle cx="0" cy="0" r="18" fill="#212121"/>
      <circle cx="0" cy="0" r="14" fill="#424242"/>
      <circle cx="0" cy="0" r="10" fill="#616161"/>
      <circle cx="0" cy="0" r="6" fill="#9E9E9E"/>
      <circle cx="0" cy="0" r="3" fill="#BDBDBD"/>
      <!-- Wheel spokes -->
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#757575" stroke-width="2"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#757575" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#757575" stroke-width="1.5"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#757575" stroke-width="1.5"/>
    </g>
    
    <!-- Rear wheels -->
    <g transform="translate(55, 20)">
      <circle cx="0" cy="0" r="18" fill="#212121"/>
      <circle cx="0" cy="0" r="14" fill="#424242"/>
      <circle cx="0" cy="0" r="10" fill="#616161"/>
      <circle cx="0" cy="0" r="6" fill="#9E9E9E"/>
      <circle cx="0" cy="0" r="3" fill="#BDBDBD"/>
      <!-- Wheel spokes -->
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#757575" stroke-width="2"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#757575" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#757575" stroke-width="1.5"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#757575" stroke-width="1.5"/>
    </g>
    
    <!-- Car reflection/highlight -->
    <path d="M-70,-2 L-40,-12 L40,-12 L70,-2 L70,5 L-70,5 Z" 
          fill="white" opacity="0.15"/>
  </g>

  <!-- Chrome ring/ellipse around the whole emblem -->
  <ellipse cx="200" cy="190" rx="130" ry="120" fill="none" stroke="url(#chromeGrad)" stroke-width="4" opacity="0.8"/>
  <ellipse cx="200" cy="190" rx="126" ry="116" fill="none" stroke="#1565C0" stroke-width="1" opacity="0.4"/>

  <!-- Text "TecnoTaller" -->
  <defs>
    <linearGradient id="textBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5"/>
      <stop offset="100%" style="stop-color:#1E88E5"/>
    </linearGradient>
    <linearGradient id="textSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#BDBDBD"/>
    </linearGradient>
  </defs>
  
  <text x="200" y="340" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
    <tspan fill="url(#textBlue)">Tecno</tspan><tspan fill="url(#textSilver)">Taller</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#90CAF9" letter-spacing="6" font-weight="300">
    SOLUCIONES AUTOMOTRICES
  </text>

  <!-- Subtle light effect at bottom -->
  <ellipse cx="200" cy="380" rx="100" ry="8" fill="#2196F3" opacity="0.15"/>
</svg>
